[project]
name = "humanus"
version = "0.34.0"
description = "Configurable editorial compliance checks: policy packs, deterministic rules, zero-shot decision models and rewrite suggestions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Anthus AI Solutions" }
]
dependencies = [
    "PyYAML>=6.0.2,<7.0.0",
    "jsonschema>=4.18,<5",
    "markdown-it-py>=3.0,<5",
]

[project.optional-dependencies]
jev = [
    "typesafe-sdk>=0.7.2,<0.8",
]
dev = [
    "behave>=1.2.6",
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/AnthusAI/Humanus"
Repository = "https://github.com/AnthusAI/Humanus"

[project.scripts]
humanus = "humanus.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humanus = ["data/SKILL.md", "schemas/*.json", "packs/*.yml", "packs/*.md"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/humanus/__init__.py:__version__"]
build_command = "python -m pip install build && python -m build"
commit_parser = "conventional"
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
exclude_commit_patterns = []

[tool.semantic_release.remote]
type = "github"
