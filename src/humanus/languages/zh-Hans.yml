# Simplified Chinese language pack. Serves zh-Hans and the regions written in
# Simplified characters (zh-CN, zh-SG, zh-MY); never Traditional (zh-Hant).
tag: zh-Hans
version: "1.1.0"
name: Simplified Chinese
aliases: [zh-CN, zh-SG, zh-MY]

# Chinese is written without spaces between words, so a phrase matches
# anywhere in running text.
phraseMatching: substring

# Length is counted in characters: each Han character is one unit, and so is
# each run of Latin letters or digits ("Waymo", "2025").
units:
  name: character
  pattern: '[㐀-䶿一-鿿豈-﫿]|[A-Za-z0-9]+(?:[''’-][A-Za-z0-9]+)*'

segmentation:
  # Full-width marks end a sentence with no space after them and no capital.
  terminators: '。！？'
  # Half-width marks (a slip the typography pack reports) end a sentence only
  # before white space, so "5.0" and "UI.js" stay whole.
  spacedTerminators: '.!?'
  closers: '”’」』）》】"'')]*_'
  openers: '“‘「『（《【"''([*_`'
  capitalAfter: false
  abbreviationOpeners: '(["“''‘'
  abbreviations: []

quotations:
  - ['“', '”']
  - ['"', '"']
  - ['「', '」']
  - ['『', '』']

builtins: [no_emojis, sentence_length, average_sentence_length, paragraph_length, frame, density, typography]

lexicons:
  passiveMarkers: [被]
  # For source-against-translation checks (see the en pack). Chinese is
  # matched anywhere in running text, so a short entry also matches inside
  # longer words (约 in 约束, 近 in 最近). The hedge list is generous on
  # purpose: as a translation's list, an extra match can only hide a dropped
  # hedge in an unrelated word, never invent one. The certainty list is strict
  # (一定 is left out: 一定程度 means "to some extent").
  hedges: [
    可能, 或许, 也许, 大概, 恐怕, 似乎, 看来, 看似, 看起来, 好像, 据称, 据报道, 据悉, 估计, 估算, 约, 左右, 近, 将近,
    几乎, 差不多, 疑似, 涉嫌, 或将, 推测, 怀疑, 未必,
  ]
  certainty: [肯定, 显然, 无疑, 毫无疑问, 必然, 必定]
  attribution: [表示, 声称, 称, 说, 据, 指出, 写道, 报道, 认为, 透露, 介绍, 提到, 坦言, 强调]

# What a proper name looks like: in Chinese text, the names that must
# survive translation are written in Latin letters (Hugging Face, METR).
names: latin-runs

# How numbers are read back as values. Large numbers are counted in 万 and
# 亿; Chinese numerals (三, 两百, 二〇二六) are read too, but only to confirm
# a value written in digits on the other side.
numbers:
  decimal: '.'
  group: ','
  minimumGroupingDigits: 1
  alsoRead: []
  scales: {千: 1000, 万: 10000, 亿: 100000000, 万亿: 1000000000000}
  words: {}
  months: []
  numerals:
    digits: {零: 0, 〇: 0, 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9}
    units: {十: 10, 百: 100, 千: 1000, 万: 10000, 亿: 100000000}

tagger: null

baseline:
  passiveMarkers:
    per1000: 1.0
    measured: false
    source: >-
      Provisional, not yet measured: to be replaced by a rate computed from an
      openly licensed corpus of native Simplified Chinese news. Xiao and Dai
      (2014), comparing ZCTC (translated) with LCMC (native), found 被 passives
      significantly more frequent in translated Chinese (LL = 69.59, p < 0.001)
      and short agentless ones especially so, but publish the rates only in a
      figure. https://eprints.lancs.ac.uk/id/eprint/64330/1/02_Xiao_and_Dai.pdf

typography:
  # Characters of the language's own script, for the rules that look at what
  # stands next to a mark.
  scriptCharacters: '[㐀-䶿一-鿿豈-﫿]'
  # GB/T 15834-2011: full-width punctuation in Chinese text. "context" says
  # which neighbour (ignoring spaces) must be a Chinese character.
  punctuationWidth:
    - {mark: ',', fullWidth: '，', context: either}
    - {mark: '.', fullWidth: '。', context: before, notBefore: '[A-Za-z0-9]'}
    - {mark: ':', fullWidth: '：', context: either}
    - {mark: ';', fullWidth: '；', context: either}
    - {mark: '?', fullWidth: '？', context: either}
    - {mark: '!', fullWidth: '！', context: either}
    - {mark: '(', fullWidth: '（', context: after}
    - {mark: ')', fullWidth: '）', context: before}
  # No space is written beside these marks.
  fullWidthPunctuation: '，。：；？！（）“”‘’《》〈〉、…—「」『』【】'
  # Mainland usage: “” outside, ‘’ inside.
  quotes:
    outer: ['“', '”']
    inner: ['‘', '’']
  ellipsis: '……'
  # House choice (not a standard): one space between Chinese and Latin text or digits.
  latinSpacing: ' '
  # English number words left behind by a translation, and how Chinese writes them.
  numberWords:
    percent: {format: '{n}%'}
    per cent: {format: '{n}%'}
    thousand: {multiply: 1000}
    million: {multiply: 1000000}
    billion: {multiply: 1000000000}
    trillion: {multiply: 1000000000000}
  largeNumberUnits:
    - {value: 1000000000000, unit: 万亿}
    - {value: 100000000, unit: 亿}
    - {value: 10000, unit: 万}
