[project]
name = "limatus"
version = "0.33.0"
description = "Limatus is now Humanus. This package installs humanus and points the old name at it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Anthus AI Solutions" }
]
dependencies = [
    "humanus>=0.33,<1",
]

[project.optional-dependencies]
jev = [
    "humanus[jev]>=0.33,<1",
]

[project.urls]
Homepage = "https://github.com/AnthusAI/Humanus"

[project.scripts]
limatus = "humanus.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
